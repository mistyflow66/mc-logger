<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="https://meee.com.tw/x9oTG9x.png">
  <link rel="apple-touch-icon" href="https://meee.com.tw/x9oTG9x.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <title>麥塊冒險</title>
  <style>
    :root { --mc-green: #388E3C; --mc-dirt: #795548; --mc-stone: #424242; --gold: #FFD700; }
    body { font-family: 'Segoe UI', sans-serif; background: #2c2c2c; color: white; padding: 15px; text-align: center; margin:0; }
    .container { background: #3c3c3c; border: 4px solid #000; padding: 20px; border-radius: 4px; max-width: 400px; margin: auto; }
    h2 { color: #8bc34a; text-shadow: 2px 2px #000; margin: 10px 0; }
    
    /* 儀表板爆閃效果 */
    .dashboard { background: #000; border: 4px solid #555; padding: 15px; margin-bottom: 15px; cursor: default; transition: 0.3s; position: relative; overflow: hidden; }
    .jackpot-active { border-color: var(--gold); box-shadow: 0 0 20px var(--gold); animation: flash-gold 0.8s infinite; }
    
    @keyframes flash-gold {
      0% { background: #000; }
      50% { background: #4a3c00; }
      100% { background: #000; }
    }

    .balance-value { color: #00e676; font-size: 32px; font-weight: bold; font-family: 'Courier New', monospace; }
    
    .pity-bar-container { background: #222; border: 1px solid #555; height: 10px; margin: 10px 0 5px 0; border-radius: 5px; position: relative; }
    .pity-bar-fill { background: linear-gradient(90deg, #f093fb 0%, #f5576c 100%); height: 100%; width: 0%; transition: width 0.5s ease-in-out; border-radius: 5px; }
    .pity-text { font-size: 11px; color: #ff7675; text-transform: uppercase; letter-spacing: 1px; }

    .user-select { background: #4e4e4e; border: 2px solid #000; padding: 10px; margin-bottom: 15px; display: flex; justify-content: space-around; align-items: center; }
    .radio-group { cursor: pointer; display: flex; align-items: center; }
    select, input { width: 100%; padding: 12px; margin-bottom: 10px; border: 3px solid #000; background: #fff; box-sizing: border-box; font-size: 16px; color: #000; }
    button { width: 100%; padding: 15px; background: var(--mc-green); color: white; border: 3px solid #1b5e20; font-weight: bold; font-size: 18px; cursor: pointer; box-shadow: 0 4px #1b5e20; }
    
    .daily-log { background: #252525; border: 2px solid #555; padding: 10px; margin-top: 15px; text-align: left; }
    .log-title { border-bottom:1px solid #555; font-weight:bold; color: #ffeb3b; margin-bottom: 5px; }
    .score-table { width: 100%; border-collapse: collapse; margin-top: 5px; font-size: 13px; color: #fff; }
    .score-table td, .score-table th { border: 1px solid #555; padding: 6px; text-align: center; }
    .score-table th { background: #795548; }
    .hidden { display: none !important; }

    /* 彈窗樣式 */
    .modal-overlay {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85); z-index: 10000; justify-content: center; align-items: center;
    }
    .modal-content { position: relative; width: 95vw; max-width: 380px; }
    .close-btn { position: absolute; top: -45px; right: 0; color: white; font-size: 35px; cursor: pointer; padding: 5px; line-height: 1; }

    #chestGallery { 
      display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; 
      background: #1e1e1e; padding: 10px; margin-top: 5px; border-radius: 5px; 
    }
    .chest-img { width: 100%; aspect-ratio: 1 / 1; object-fit: cover; border: 2px solid #555; border-radius: 4px; }
    .stamp-card { display: flex; justify-content: space-between; align-items: center; background: #000; padding: 10px 15px; margin-top: 10px; border: 2px solid #555; }
    .stamp-item { font-size: 14px; color: #ffeb3b; flex: 1; text-align: center; white-space: nowrap; }
  </style>
</head>
<body>
  <div class="container">
    <h2>💎 冒險儀表板</h2>
    <div id="timer" style="font-size: 12px; color: #aaa; margin-bottom: 10px;">載入中...</div>

    <div id="mainDashboard" class="dashboard" onclick="handleDashboardClick()">
      <div style="color:#fff; font-size:14px;">🔋 目前 3C 能量</div>
      <div class="balance-value" id="balanceDisplay">0</div>
      
      <div id="pitySection">
        <div class="pity-bar-container">
          <div id="pityBar" class="pity-bar-fill"></div>
        </div>
        <div class="pity-text">✨ 幸運保底進度: <span id="pityValue">0</span>/5</div>
      </div>

      <div class="stamp-card">
        <div class="stamp-item">⭐ 起床: <span id="wakeupCount">0</span>/10</div>
        <div class="stamp-item">❤️ GOOD: <span id="goodCount">0</span>/10</div>
      </div>
    </div>

    <div class="user-select">
      <span>角色:</span>
      <label class="radio-group"><input type="radio" name="user" value="卉" checked onclick="switchUser('卉')"> 卉</label>
      <label class="radio-group"><input type="radio" name="user" value="姐" onclick="switchUser('姐')"> 姐</label>
    </div>

    <div id="passwordArea" class="hidden">
      <input type="password" id="passwordInput" placeholder="輸入密碼">
    </div>

    <form id="questForm">
      <select id="typeSelect" onchange="updateItems()" required></select>
      <select id="itemSelect" onchange="checkValueType()" required></select>
      <div id="valueArea">
        <input id="valueInput" placeholder="數量/分數">
      </div>
      <input type="text" id="noteInput" placeholder="寫點備註..."> 
      <button type="button" onclick="submitForm()">💾 存檔紀錄</button>
    </form>

    <div id="chestSection" style="margin-top:10px; text-align:left;">
      <div style="cursor:pointer; color:#55efc4; font-size:14px;" onclick="toggleChest()">📦 我的寶箱 (點開相簿)</div>
      <div id="chestWrapper" class="hidden" style="background: #1e1e1e; margin-top: 5px; border-radius: 5px;">
        <div id="chestGallery"></div>
      </div>
    </div>

    <div id="giftArea" class="hidden" style="margin-top:20px; background:#000; border:3px dashed #ffeb3b; padding:10px;">
      <div style="color:#ffeb3b; font-weight:bold;">🍎 發現掉落物！</div>
      <img id="luckyGif" src="" style="width:100%; border-radius:8px; margin-top:5px;">
    </div>

    <div class="daily-log">
      <div class="log-title">📅 今天的日誌</div>
      <div id="todayList" style="color:#8bc34a; font-size: 14px;"></div>
    </div>

    <div class="daily-log" style="border-color: #fab1a0;">
      <div class="log-title" style="color: #ff7675;">📢 悄悄話留言板</div>
      <div id="noteList" style="font-size: 13px; color: #dfe6e9;"></div>
    </div>

    <div class="daily-log" style="border-color: #8bc34a;">
      <div class="log-title" style="color: #8bc34a;">📊 運動換算表</div>
      <table class="score-table">
        <thead>
          <tr><th>項目</th><th>基準單位</th><th>能量</th></tr>
        </thead>
        <tbody>
          <tr><td>跳繩</td><td>100 下</td><td>+ 5</td></tr>
          <tr><td>跑步</td><td>200 公尺</td><td>+ 5</td></tr>
          <tr><td>仰臥起坐</td><td>1 分鐘</td><td>+ 5</td></tr>
          <tr style="color: #ffeb3b; background: #333;"><td>⭐ 自己起床</td><td>滿 10 次</td><td>+ 5</td></tr>
          <tr style="color: #ffeb3b; background: #333;"><td>❤️ GOOD</td><td>滿 10 次</td><td>+ 10</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <div id="slotModal" class="modal-overlay">
    <div class="modal-content">
      <span class="close-btn" onclick="closeSlotModal()">&times;</span>
      <iframe id="slotFrame" src="" width="100%" height="400px" frameborder="0" scrolling="no"></iframe>
    </div>
  </div>

  <div id="creeperModal" class="modal-overlay">
    <div class="modal-content">
      <span class="close-btn" onclick="closeCreeperModal()">&times;</span>
      <iframe id="creeperFrame" src="" width="100%" height="400px" frameborder="0"></iframe>
    </div>
  </div>

  <script>
    let userKey = localStorage.getItem('mc_access_key') || "";
    const gasUrl = "https://script.google.com/macros/s/AKfycby8MaeORmgHynbc4qTnjUUCyn12NWZYJP6HEhCZ1wEsXOX3fnTlQT-LP9l8FRNQf4cG/exec"; 
    const openingDate = new Date("2026-02-23T08:00:00");
    const optionsMap = {
      "卉": { "運動": ["跳繩", "跑步", "仰臥起坐"], "3C": ["看電視", "用手機", "玩電腦"], "規劃": ["閱讀", "做小書", "練習英文", "其他"] },
      "姐": { "運動": ["跳繩", "跑步", "仰臥起坐"], "3C": ["看電視", "用手機", "玩電腦"], "獎勵": ["自己起床", "GOOD", "加分", "扣分"] }
    };
    
    let allChestImages = [];
    let dashClickCount = 0;
    let dashClickTimer = null;

    function refreshData() {
      if (!userKey) return;
      fetch(`${gasUrl}?action=readData&key=${userKey}`)
        .then(res => res.json())
        .then(data => {
          if (data.error) {
            localStorage.removeItem('mc_access_key');
            userKey = "";
            return;
          }
          document.getElementById('balanceDisplay').innerText = data.total3C || 0;
          document.getElementById('todayList').innerHTML = (data.todayLogs && data.todayLogs.length > 0) ? data.todayLogs.join("<br>") : "今天還沒有紀錄";
          document.getElementById('wakeupCount').innerText = data.wakeup || 0;
          document.getElementById('goodCount').innerText = data.good || 0;
          document.getElementById('noteList').innerHTML = (data.notes && data.notes.length > 0) ? data.notes.join("<br>") : "目前沒有留言";
          
          const pity = data.pityProgress || 0;
          document.getElementById('pityValue').innerText = pity;
          document.getElementById('pityBar').style.width = (pity / 5 * 100) + "%";
          
          const dash = document.getElementById('mainDashboard');
          if (data.isJackpotReady) {
            dash.classList.add('jackpot-active');
          } else {
            dash.classList.remove('jackpot-active');
          }

          allChestImages = data.myChest || [];
          renderChest();
        });
    }

    // 監聽抽獎機訊息
    window.addEventListener('message', function(e) {
      if (e.data === 'closeModal') { closeSlotModal(); return; }
      const currentUser = document.querySelector('input[name="user"]:checked').value;
      let itemType = "";
      let bonusValue = 0;

      if (e.data === 'win') { itemType = "抽獎"; bonusValue = 1; } 
      else if (e.data === 'near') { itemType = "抽獎"; bonusValue = 0.5; } 
      else if (e.data === 'lose') { itemType = "抽獎失敗"; bonusValue = 1; }

      if (itemType && currentUser === "卉") {
        const note = encodeURIComponent(`自動紀錄：${e.data}`);
        const saveUrl = `${gasUrl}?action=addData&key=${userKey}&user=${currentUser}&category=獎勵&item=${itemType}&value=${bonusValue}&otherNote=&note=${note}`;
        fetch(saveUrl).then(() => refreshData());
      }
    }, false);

    function switchUser(user) {
      document.getElementById('passwordArea').classList.toggle('hidden', user !== '姐');
      const typeSelect = document.getElementById('typeSelect');
      typeSelect.innerHTML = '<option value="">-- 選擇類別 --</option>';
      Object.keys(optionsMap[user]).forEach(t => typeSelect.add(new Option(t, t)));
      document.getElementById('pitySection').classList.toggle('hidden', user === '姐');
      updateItems();
    }

    function updateItems() {
      const user = document.querySelector('input[name="user"]:checked').value;
      const type = document.getElementById('typeSelect').value;
      const itemSelect = document.getElementById('itemSelect');
      itemSelect.innerHTML = '<option value="">-- 選擇項目 --</option>';
      if (optionsMap[user][type]) {
        optionsMap[user][type].forEach(i => itemSelect.add(new Option(i, i)));
      }
      checkValueType();
    }

    function checkValueType() {
      const type = document.getElementById('typeSelect').value;
      const item = document.getElementById('itemSelect').value;
      const valInput = document.getElementById('valueInput');
      if (type === "規劃" || item === "其他") {
        valInput.type = "text"; valInput.placeholder = "做了什麼？";
      } else {
        valInput.type = "number"; valInput.placeholder = "輸入數量(數字)";
      }
    }

    // 存檔邏輯：補回掉落物檢測
    function submitForm() {
      if (!userKey) return;
      const user = document.querySelector('input[name="user"]:checked').value;
      const submitBtn = document.querySelector('button[onclick="submitForm()"]');
      if (user === '姐' && document.getElementById('passwordInput').value !== "3672") { alert("密碼錯誤！"); return; }
      
      const type = document.getElementById('typeSelect').value;
      const item = document.getElementById('itemSelect').value;
      const valRaw = document.getElementById('valueInput').value.trim();
      if (!type || !item || !valRaw) { alert("內容未填齊！"); return; }
      
      submitBtn.disabled = true;
      const isText = (type === "規劃" || item === "其他");
      const url = `${gasUrl}?action=addData&key=${userKey}&user=${user}&category=${type}&item=${item}&value=${isText?0:valRaw}&otherNote=${encodeURIComponent(isText?valRaw:"")}&note=${encodeURIComponent(document.getElementById('noteInput').value)}`;
      
      fetch(url).then(res => res.text()).then(resText => {
        // 重要：偵測回傳是否為圖片 URL
        if (user === "卉" && resText && resText.startsWith("http")) {
          document.getElementById('giftArea').classList.remove('hidden');
          document.getElementById('luckyGif').src = resText;
        } else {
          document.getElementById('giftArea').classList.add('hidden');
        }
        
        // 觸發抽獎
        if (user === "姐" || (user === "卉" && type === "運動" && Math.random() < 0.25)) {
          setTimeout(openSlotModal, 1000);
        }
        refreshData();
        document.getElementById('valueInput').value = "";
        document.getElementById('noteInput').value = "";
      }).finally(() => { submitBtn.disabled = false; });
    }

    function renderChest() {
      const gallery = document.getElementById('chestGallery');
      if (allChestImages.length === 0) {
        gallery.innerHTML = "<div style='color:#777;font-size:12px;'>寶箱還是空的...</div>";
        return;
      }
      gallery.innerHTML = allChestImages.slice(-10).reverse().map(url => `<img src="${url}" class="chest-img">`).join("");
    }

    function toggleChest() { document.getElementById('chestWrapper').classList.toggle('hidden'); }
    
    function openSlotModal() { 
      document.getElementById('slotFrame').src = "slot.html"; 
      document.getElementById('slotModal').style.display = 'flex'; 
    }
    function closeSlotModal() { document.getElementById('slotModal').style.display = 'none'; }
    
    // 點擊 5 下開啟苦力怕：補回每次重置 iframe 邏輯
    function handleDashboardClick() {
      dashClickCount++;
      clearTimeout(dashClickTimer);
      dashClickTimer = setTimeout(() => { dashClickCount = 0; }, 2000);
      if (dashClickCount === 5) {
        dashClickCount = 0;
        openCreeperModal();
      }
    }

    function openCreeperModal() {
      const frame = document.getElementById('creeperFrame');
      frame.src = ""; // 先清空，確保每次都是全新的遊戲
      setTimeout(() => {
        frame.src = "https://mistyflow66.github.io/creeper/";
        document.getElementById('creeperModal').style.display = 'flex';
      }, 50);
    }

    function closeCreeperModal() {
      document.getElementById('creeperModal').style.display = 'none';
      document.getElementById('creeperFrame').src = ""; 
    }

    function updateTimer() {
      const now = new Date();
      const diff = openingDate - now;
      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      document.getElementById('timer').innerText = `更新：${now.getMonth()+1}/${now.getDate()} ${now.getHours()}:${now.getMinutes().toString().padStart(2,'0')} | 距離開學：${days} 天 ${hours} 時`;
    }

    function checkAccess() { 
      if(!userKey) { 
        userKey = prompt("請輸入通關密語："); 
        if(userKey) { localStorage.setItem('mc_access_key', userKey); refreshData(); } 
      } 
    }

    window.onload = () => { 
      switchUser('卉'); 
      checkAccess(); 
      if(userKey) refreshData(); 
      setInterval(updateTimer, 60000); 
      updateTimer();
    };
  </script>
</body>
</html>
